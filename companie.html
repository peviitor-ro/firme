<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalii Companie - Firme-Ro</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/companie.css" />
  </head>
  <body>
    <main class="company-main">
      <!-- Modern Sidebar with standardized dimensions -->
      <aside class="sidebar f-col">
        <div class="sidebar-top">
          <a href="index.html" class="sidebar-brand">
            <img class="logo" src="./assets/logo.png" alt="Firme.ro" />
          </a>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-nav">
          <a href="index.html" id="sidebarBackLink" class="sidebar-nav-item">
            <i class="ri-arrow-left-line"></i>
            <span>Înapoi la rezultate</span>
          </a>
          <a href="admin.html" id="sidebarAdminEditLink" class="sidebar-nav-item">
            <i class="ri-edit-box-line"></i>
            <span>Editează în pagina de admin</span>
          </a>
        </div>

        <div class="sidebar-divider"></div>

        <!-- Sidebar Base / Footer (Auth Component) -->
        <div class="sidebar-footer">
          <div id="sidebarAuthContainer" class="sidebar-auth-wrapper"></div>
        </div>
      </aside>

      <!-- Main Company Details Area -->
      <section class="company-content f-col">
        <div class="f-col" id="company-card"></div>
      </section>
    </main>

    <script src="./scripts/auth.js"></script>
    <script src="./scripts/companie.js"></script>
  </body>
</html>
