<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panou Administrare - Firme-Ro</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/admin.css" />
    <script src="./scripts/theme.js"></script>
  </head>
  <body>
    <main class="admin-main">
      <aside class="admin-sidebar sidebar f-col">
        <div class="admin-sidebar-top">
          <div class="sidebar-brand-wrapper">
            <a href="index.html" class="sidebar-brand">
              <img
                class="logo logo-light"
                src="./assets/logo.svg"
                alt="Firme.ro"
              />
              <img
                class="logo logo-dark"
                src="./assets/logo-dark.svg"
                alt="Firme.ro"
              />
            </a>
            <button
              id="themeToggleBtn"
              class="theme-toggle-btn"
              type="button"
              aria-label="Comută tema"
              title="Comută tema"
            >
              <i class="ri-moon-line"></i>
            </button>
          </div>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-nav">
          <a href="index.html" id="sidebarBackLink" class="sidebar-nav-item">
            <i class="ri-arrow-left-line"></i>
            <span>Înapoi la rezultate</span>
          </a>
        </div>

        <div class="sidebar-divider"></div>
        <div class="sidebar-footer">
          <div id="sidebarAuthContainer" class="sidebar-auth-wrapper"></div>
        </div>
      </aside>

      <section class="admin-content f-col">
        <div class="admin-header">
          <div class="admin-title-row">
            <i class="ri-dashboard-3-line admin-title-icon"></i>
            <div>
              <h1>Administrare Date Firme</h1>
              <p>
                Căutați o companie după denumire sau CUI pentru a actualiza,
                adăuga sau șterge atribute.
              </p>
            </div>
          </div>
        </div>

        <div id="mainApp">
          <form class="search-admin-form">
            <div class="search-group">
              <i class="ri-search-line search-icon"></i>
              <input
                type="text"
                id="searchId"
                autocomplete="off"
                placeholder="Introduceți Denumire sau CUI..."
              />
            </div>
            <button type="submit" class="search-admin-btn">
              <i class="ri-search-line"></i> Caută Companie
            </button>
          </form>

          <div id="errorMessage"></div>
          <div id="firmDetailsContainer"></div>
        </div>
      </section>
    </main>

    <script src="./scripts/auth.js"></script>
    <script type="module" src="./scripts/admin.js"></script>
  </body>
</html>
