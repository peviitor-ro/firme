<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firme-Ro - Catalog Firme România</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <script src="./scripts/theme.js"></script>
  </head>
  <body>
    <main>
      <!-- YouTube-style Modern Sidebar -->
      <aside class="sidebar f-col">
        <div class="sidebar-top">
          <div class="sidebar-brand-wrapper">
            <a href="index.html" class="sidebar-brand">
              <img class="logo logo-light" src="./assets/logo.svg" alt="Firme.ro" />
              <img class="logo logo-dark" src="./assets/logo-dark.svg" alt="Firme.ro" />
            </a>
            <button
              id="themeToggleBtn"
              class="theme-toggle-btn"
              type="button"
              aria-label="Comută tema"
              title="Comută tema"
            >
              <i class="ri-moon-line"></i>
            </button>
          </div>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-middle">
          <form id="customForm" class="sidebar-form">
            <div class="form-group search-input-group">
              <input
                type="text"
                id="searchInput"
                autocomplete="off"
                placeholder="Caută nume, CUI, etc."
              />
              <button type="submit" id="searchSubmitBtn" class="search-submit-btn" title="Caută">
                <i class="ri-search-line"></i>
              </button>
            </div>

            <div class="sidebar-section-title">
              <i class="ri-filter-3-line"></i>
              <span>Filtrare Website</span>
            </div>

            <div class="filter-group f-col">
              <label class="filter-checkbox">
                <input type="checkbox" id="hasWebsite" />
                <span class="custom-checkbox"><i class="ri-check-line"></i></span>
                <span class="filter-label"><i class="ri-global-line"></i> Cu website</span>
              </label>
              <label class="filter-checkbox">
                <input type="checkbox" id="noWebsite" />
                <span class="custom-checkbox"><i class="ri-check-line"></i></span>
                <span class="filter-label"><i class="ri-link-unlink-m"></i> Fără website</span>
              </label>
            </div>
          </form>
        </div>

        <div class="sidebar-divider"></div>

        <!-- Sidebar Base / Footer (Auth & Admin link post-login) -->
        <div class="sidebar-footer">
          <div id="sidebarAuthContainer" class="sidebar-auth-wrapper"></div>
        </div>
      </aside>

      <!-- Main Results Area -->
      <section class="content-area f-col">
        <div class="right-header f-row">
          <div class="active-filters"></div>
          <button id="clearFilters">
            <i class="ri-refresh-line"></i>
            <span>Resetează filtre</span>
          </button>
        </div>

        <div id="results">
          <div id="firmDetailsContainer" class="company-grid"></div>
        </div>
      </section>
    </main>

    <script src="./scripts/auth.js"></script>
    <script src="./scripts/app.js"></script>
  </body>
</html>
